name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: sda, POSTGRES_PASSWORD: sda, POSTGRES_DB: sda_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sda" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway service container: integration tests never touch Neon/production.
      TEST_DATABASE_URL: postgresql://sda:sda@localhost:5432/sda_test
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-1234
      FIELD_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
